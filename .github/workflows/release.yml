name: Build and release

# Every push to main is checked, built into ready-to-run bundles, and published:
#   - v<version> from package.json, once, on the channel its suffix names
#     (1.4.0 stable; 1.4.0-rc.1, -beta.1, -alpha.1 pre-releases)
#   - dev-build, replaced each time with the newest commit
# Pull requests get the same checks and bundles, without publishing.
# How to cut a release: RELEASING.md.
#
# No job calls a real provider or a real Pterodactyl: the end-to-end checks
# talk to the mock provider in scripts/e2e, and the host scripts are tried on
# a made-up Wings host and over SSH to the runner itself (scripts/host/test).
# The workflow that does reach a real node is deploy.yml, started by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The release whose bundle is upgraded to the one just built, to see that an
  # existing installation survives the upgrade.
  UPGRADE_FROM: v1.4.0

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Shell scripts
        run: shellcheck -x -S warning scripts/*.sh scripts/host/*.sh scripts/host/test/*.sh scripts/host/test/docker
      - name: Disk report on a made-up host
        run: bash scripts/host/test/report.sh
      # The scripts that run the host scripts from somewhere else sign in to
      # an SSH server on this runner: with a key as a plain user, and as root
      # also with a password and through sudo, the way the Deploy workflow does.
      - name: Host scripts over SSH
        run: |
          command -v sshd > /dev/null 2>&1 || [ -x /usr/sbin/sshd ] || sudo apt-get install -y --no-install-recommends openssh-server
          REQUIRE_SSHD=1 bash scripts/host/test/over-ssh.sh
          sudo -n env "PATH=$PATH" REQUIRE_SSHD=1 bash scripts/host/test/over-ssh.sh
      # The script that gives the app its public address runs against a real
      # nginx: the runner's own program, started for the test in a temporary
      # folder and on ports of its own, with other sites in it. certbot and
      # Let's Encrypt are stand-ins. As a plain user and as root.
      - name: A site in nginx
        run: |
          set -o pipefail
          command -v nginx > /dev/null 2>&1 || [ -x /usr/sbin/nginx ] || sudo apt-get install -y --no-install-recommends nginx
          bash scripts/host/test/site.sh | tee "${RUNNER_TEMP}/site-test.txt"
          echo "::notice title=A site in nginx::$(tail -n 1 "${RUNNER_TEMP}/site-test.txt")"
          sudo -n env "PATH=$PATH" bash scripts/host/test/site.sh

  e2e:
    name: End-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Joining clips is checked for real when there is an ffmpeg, and for its
      # explanation of what is missing when there is none. Here there has to
      # be one: without it the run stops instead of checking less.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_REQUIRE_FFMPEG: "1"

  bundle:
    name: Bundle for Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build
        run: BUILD_SHA="${GITHUB_SHA::7}" npm run build:standalone
      - name: Package
        run: BUILD_SHA="${GITHUB_SHA::7}" npm run package
      - name: Smoke-test the bundle
        run: bash scripts/smoke-test-bundle.sh
      - name: Upgrade ${{ env.UPGRADE_FROM }} to this bundle on a made-up Pterodactyl host
        run: |
          asset="xiero-nexus-ai-linux-x64-node${{ matrix.node }}.zip"
          gh release download "${UPGRADE_FROM}" --repo "${GITHUB_REPOSITORY}" --pattern "${asset}" --dir "${RUNNER_TEMP}/previous"
          OLD_ZIP="${RUNNER_TEMP}/previous/${asset}" NEW_ZIP="dist/${asset}" bash scripts/host/test/run.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # The server is set up as the common Node.js egg leaves one, and started
      # as that egg starts it: its main file through "ts-node --esm". ts-node 10
      # does not work with TypeScript 7, so an older one is put next to it.
      - name: First installation of this bundle on a made-up Pterodactyl host
        run: |
          npm install --no-save --no-audit --no-fund --prefix "${RUNNER_TEMP}/ts-node" ts-node@10.9.2 typescript@6.0.3
          NEW_ZIP="dist/xiero-nexus-ai-linux-x64-node${{ matrix.node }}.zip" TS_NODE="${RUNNER_TEMP}/ts-node/node_modules/.bin/ts-node" bash scripts/host/test/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-node${{ matrix.node }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish releases
    needs: [check, e2e, bundle]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-node*
          path: dist
          merge-multiple: true
      - name: Publish
        run: bash scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
